name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Install SwiftLint
        run: brew install swiftlint
      # Informational: swift-format output can differ between Swift versions, so this step does not fail the job.
      - name: Format check
        continue-on-error: true
        run: xcrun swift-format lint --configuration .swift-format --strict --recursive Sources Tests Package.swift
      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --strict --quiet
      - name: Regression tests
        run: ./scripts/test.sh
      - name: Release build
        run: swift build -c release
